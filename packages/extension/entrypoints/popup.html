<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			width: 320px;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
			font-size: 13px;
			color: #1f2328;
			padding: 16px;
		}
		h1 { font-size: 16px; margin-bottom: 12px; }
		.status { margin-bottom: 12px; color: #656d76; }
		.status.authenticated { color: #1a7f37; }
		input {
			width: 100%;
			padding: 6px 10px;
			border: 1px solid #d0d7de;
			border-radius: 6px;
			font-size: 13px;
			margin-bottom: 8px;
		}
		button {
			padding: 6px 14px;
			border: 1px solid #d0d7de;
			border-radius: 6px;
			background: #f6f8fa;
			cursor: pointer;
			font-size: 13px;
			margin-right: 4px;
		}
		button:hover { background: #eef0f2; }
		button.primary { background: #2da44e; color: #fff; border-color: #2da44e; }
		button.primary:hover { background: #218838; }
		.search { position: relative; }
		.suggestions {
			position: absolute;
			top: calc(100% - 4px);
			left: 0;
			right: 0;
			z-index: 10;
			list-style: none;
			background: #fff;
			border: 1px solid #d0d7de;
			border-radius: 6px;
			box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
			max-height: 216px;
			overflow-y: auto;
			padding: 4px 0;
		}
		.suggestions[hidden] { display: none; }
		.suggestion {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 6px 10px;
			cursor: pointer;
		}
		.suggestion[aria-selected="true"], .suggestion:hover { background: #f6f8fa; }
		.suggestion img {
			width: 20px;
			height: 20px;
			border-radius: 50%;
			flex-shrink: 0;
			outline: 1px solid rgba(0, 0, 0, 0.1);
			outline-offset: -1px;
		}
		.suggestion.org img { border-radius: 4px; }
		.suggestion .login { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.suggestion .kind { color: #656d76; font-size: 11px; }
		.suggestions .empty { padding: 6px 10px; color: #656d76; }
		#result { margin-top: 12px; white-space: pre-wrap; font-size: 12px; }
	</style>
</head>
<body>
	<h1>GitBaz</h1>
	<div id="auth-status" class="status">Checking...</div>
	<div id="lookup">
		<div class="search">
			<input
				type="text"
				id="username"
				placeholder="GitHub username"
				autocomplete="off"
				spellcheck="false"
				role="combobox"
				aria-autocomplete="list"
				aria-expanded="false"
				aria-controls="suggestions"
			/>
			<ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
		</div>
		<button class="primary" id="lookup-btn">Get Contributor Score</button>
	</div>
	<div id="result"></div>
	<script src="./popup/main.ts" type="module"></script>
</body>
</html>
